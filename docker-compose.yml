services:
  moeflow-mongodb:
    image: mongo:latest
    container_name: moeflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - moeflow_db_data:/data/db  # 使用命名卷

  moeflow-rabbitmq:
    image: rabbitmq:3-management
    container_name: moeflow-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

# 在文件最下方添加卷定义
volumes:
  moeflow_db_data:

